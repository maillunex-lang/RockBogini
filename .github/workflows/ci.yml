name: CI
on: [push, pull_request]
jobs:
  next-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: next-server/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
  pixi-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pixi-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pixi-client/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
